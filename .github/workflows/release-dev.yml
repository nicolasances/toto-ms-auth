name: Dev Release

on:
  push:
    branches:
      - 'feature/**'

# Two deploys to the same namespace must not race
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  release:
    name: Build & Deploy to Cloud Run and GKE
    environment: totoexperiments
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

    - name: Setup GCloud
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ vars.GCP_PID }}
        install_components: gke-gcloud-auth-plugin

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

    - name: Compute image tag
      run: |
        PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        PACKAGE_NAME=$(cat package.json | grep name | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        # Dev tag: <version>-<short sha>. Unique per commit, no version bump needed.
        IMAGE_TAG=${PACKAGE_VERSION}-${GITHUB_SHA::7}
        IMAGE=europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${PACKAGE_NAME}/${PACKAGE_NAME}:${IMAGE_TAG}
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

    - name: Check whether the image already exists
      run: |
        # A re-run for the same commit finds the image and skips build and push.
        # Only a real "not found" counts as "doesn't exist": any other error (e.g. auth) fails the job.
        if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>describe.err; then
          echo "IMAGE_EXISTS=true" >> $GITHUB_ENV
          echo "Image $IMAGE already exists: skipping build and push."
        elif grep -qiE 'not found|NOT_FOUND' describe.err; then
          echo "IMAGE_EXISTS=false" >> $GITHUB_ENV
        else
          cat describe.err
          echo "::error::Could not check whether $IMAGE exists."
          exit 1
        fi

    - name: Build Docker image
      if: env.IMAGE_EXISTS != 'true'
      run: docker build . -t "$IMAGE"

    - name: Push Docker image to Artifact Registry
      if: env.IMAGE_EXISTS != 'true'
      run: docker push "$IMAGE"

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.PACKAGE_NAME }} --set-env-vars "HYPERSCALER=gcp,GCP_PID=${{ vars.GCP_PID }}" --service-account=${{ secrets.SERVICE_ACCOUNT }} --project=${{ vars.GCP_PID }} --image="$IMAGE" --platform=managed --region=europe-west1 --allow-unauthenticated

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        project_id: ${{ vars.GKE_PROJECT_ID }}
        cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
        location: ${{ vars.GKE_CLUSTER_LOCATION }}

    - name: Deploy to GKE
      run: |
        kubectl -n ${{ vars.GKE_NAMESPACE }} set image deployment/toto-ms-auth toto-ms-auth="$IMAGE"
        kubectl -n ${{ vars.GKE_NAMESPACE }} rollout status deployment/toto-ms-auth --timeout=5m
